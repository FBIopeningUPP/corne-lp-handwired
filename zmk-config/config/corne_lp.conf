# --- display: Blip on both halves ---
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# uncomment if Blip shows upside down
# CONFIG_CORNE_LP_OLED_FLIP=y

# --- battery life (WLY450838, 120 mAh per half) ---
# screens off after 30 s without typing
CONFIG_ZMK_IDLE_TIMEOUT=30000
# deep sleep after 15 min, any key wakes it
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# &soft_off key on the ADJ layer
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_BATTERY_REPORTING=y

# --- wireless ---
# TX power is set per half: corne_lp_left.conf (+8 dBm to the computer), corne_lp_right.conf (0 dBm)

# --- trackpad / pointing ---
CONFIG_ZMK_POINTING=y
